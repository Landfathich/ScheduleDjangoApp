{% extends "core/base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'leads/css/leads.css' %}">
{% endblock %}

{% block content %}
<div class="leads-container">
    <div class="leads-header">
        <h1>Новый клиент из лида</h1>
    </div>

    <div class="convert-form-wrapper">
        <form id="convert-form">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя родителя</label>
                <input type="text" name="name" value="{{ lead.name }}" required>
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" value="{{ lead.phone }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ lead.email }}">
            </div>
            <div class="form-group">
                <label>Заметка к телефону</label>
                <input type="text" name="note" placeholder="Например: мама, папа, бабушка">
            </div>
            <div class="form-group">
                <label>Курс из заявки</label>
                <input type="text" value="{{ lead.course }}" disabled>
            </div>

            <div class="form-actions">
                <a href="{% url 'lead-list' %}" class="cancel-btn">Отмена</a>
                <button type="submit" class="submit-btn">Создать клиента</button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('convert-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    fetch('{% url "convert-lead-submit" lead.id %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'ok') {
            window.location.href = '{% url "lead-list" %}';
        } else {
            alert('Ошибка: ' + data.error);
        }
    });
});
</script>
{% endblock %}
