{% extends 'core/base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
{% endblock %}

{% block content %}
    <div class="content">
        <h2>Вход</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <p>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </p>
            {% endfor %}
            <button type="submit">Войти</button>
        </form>
    </div>
{% endblock %}
